name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used by the release step on tags
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ubuntu runners ship the Android SDK (ANDROID_HOME); AGP fetches any
      # missing platform or build-tools itself.
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: etchosts-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Name the release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk "etchosts-${GITHUB_REF_NAME}-debug.apk"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: etchosts-${{ github.ref_name }}-debug.apk
