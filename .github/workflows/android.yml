name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release steps: the rolling "latest" on main pushes and v* tags
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ubuntu runners ship the Android SDK (ANDROID_HOME); AGP fetches any
      # missing platform or build-tools itself.
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: etchosts-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Every push to main replaces the rolling "latest" pre-release, so the
      # newest APK is always one click away without cutting a version tag.
      - name: Move the latest tag to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest
          cp app/build/outputs/apk/debug/app-debug.apk etchosts-latest-debug.apk

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest build (main)
          prerelease: true
          body: |
            Debug APK built from main at ${{ github.sha }}.

            ${{ github.event.head_commit.message }}
          files: etchosts-latest-debug.apk

      - name: Name the release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk "etchosts-${GITHUB_REF_NAME}-debug.apk"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: etchosts-${{ github.ref_name }}-debug.apk
